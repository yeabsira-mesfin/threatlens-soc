name: ThreatLens CI
on:
  push:
    branches: ["feature/**"]
  pull_request:
jobs:
  detection-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local SOC API requirements
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Seed disposable synthetic SOC environment
        working-directory: backend
        run: python seed.py
        env:
          THREATLENS_SECRET: ${{ github.run_id }}-${{ github.sha }}
          THREATLENS_DEMO_PASSWORD: ${{ github.sha }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile SOC browser QA
        run: npm run test:e2e
        env:
          THREATLENS_SECRET: ${{ github.run_id }}-${{ github.sha }}
          THREATLENS_DEMO_PASSWORD: ${{ github.sha }}
      - name: Store screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threatlens-browser-qa
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: Validate local Docker Compose configuration
        working-directory: .
        run: docker compose --env-file docker.env.example config --quiet
      - name: Build local container images
        working-directory: .
        run: docker compose --env-file docker.env.example build
